name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to copy from GHCR, for example v0.3.1
        required: true
        type: string
      promote_aliases:
        description: Also move the Docker Hub minor and latest tags to this release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  DOCKERHUB_APP: docker.io/0xmythril/steno-personal
  DOCKERHUB_UPDATER: docker.io/0xmythril/steno-personal-updater

concurrency:
  group: release-images-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Validate stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          node -e 'const v=require("./package.json").version;if(!/^\d+\.\d+\.\d+$/.test(v)||process.env.RELEASE_TAG!=="v"+v)process.exit(1)'
          git merge-base --is-ancestor HEAD origin/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            published_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name')
            [ "$published_tag" = "$RELEASE_TAG" ] || {
              echo "$RELEASE_TAG is not a published stable GitHub release." >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/smoke.sh
      - run: bash scripts/smoke-upgrades.sh
      - run: node scripts/smoke-upgrade-setup.mjs

  publish:
    if: ${{ github.event_name == 'release' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.RELEASE_TAG }}' }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publish application image
        id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.base }}:${{ env.RELEASE_TAG }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Publish updater image
        id: updater
        uses: docker/build-push-action@v7
        with:
          context: .
          file: updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.base }}-updater:${{ env.RELEASE_TAG }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Sign published images
        env:
          APP_IMAGE: ${{ steps.images.outputs.base }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          UPDATER_IMAGE: ${{ steps.images.outputs.base }}-updater
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          cosign sign --yes "$APP_IMAGE@$APP_DIGEST"
          cosign sign --yes "$UPDATER_IMAGE@$UPDATER_DIGEST"

  publish-dockerhub:
    if: ${{ github.repository == '0xmythril/steno-personal' && github.event_name == 'release' }}
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Mirror application image
        env:
          MINOR: ${{ needs.verify.outputs.minor }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_APP:$RELEASE_TAG" \
            --tag "$DOCKERHUB_APP:$VERSION" \
            --tag "$DOCKERHUB_APP:$MINOR" \
            --tag "$DOCKERHUB_APP:latest" \
            "ghcr.io/0xmythril/steno-personal:$RELEASE_TAG"
      - name: Mirror updater image
        env:
          MINOR: ${{ needs.verify.outputs.minor }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_UPDATER:$RELEASE_TAG" \
            --tag "$DOCKERHUB_UPDATER:$VERSION" \
            --tag "$DOCKERHUB_UPDATER:$MINOR" \
            --tag "$DOCKERHUB_UPDATER:latest" \
            "ghcr.io/0xmythril/steno-personal-updater:$RELEASE_TAG"
      - name: Verify and sign Docker Hub images
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          app_digest=$(docker buildx imagetools inspect "$DOCKERHUB_APP:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          updater_digest=$(docker buildx imagetools inspect "$DOCKERHUB_UPDATER:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$DOCKERHUB_APP@$app_digest"
          cosign sign --yes "$DOCKERHUB_UPDATER@$updater_digest"

  mirror:
    if: ${{ github.repository == '0xmythril/steno-personal' && github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy immutable release tags from GHCR
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_APP:$RELEASE_TAG" \
            --tag "$DOCKERHUB_APP:$VERSION" \
            "ghcr.io/0xmythril/steno-personal:$RELEASE_TAG"
          docker buildx imagetools create \
            --tag "$DOCKERHUB_UPDATER:$RELEASE_TAG" \
            --tag "$DOCKERHUB_UPDATER:$VERSION" \
            "ghcr.io/0xmythril/steno-personal-updater:$RELEASE_TAG"
      - name: Promote floating tags
        if: ${{ inputs.promote_aliases }}
        env:
          MINOR: ${{ needs.verify.outputs.minor }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_APP:$MINOR" \
            --tag "$DOCKERHUB_APP:latest" \
            "$DOCKERHUB_APP:$VERSION"
          docker buildx imagetools create \
            --tag "$DOCKERHUB_UPDATER:$MINOR" \
            --tag "$DOCKERHUB_UPDATER:latest" \
            "$DOCKERHUB_UPDATER:$VERSION"
      - name: Verify Docker Hub manifests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools inspect "$DOCKERHUB_APP:$VERSION"
          docker buildx imagetools inspect "$DOCKERHUB_UPDATER:$VERSION"
      - name: Sign mirrored images
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          app_digest=$(docker buildx imagetools inspect "$DOCKERHUB_APP:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          updater_digest=$(docker buildx imagetools inspect "$DOCKERHUB_UPDATER:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$DOCKERHUB_APP@$app_digest"
          cosign sign --yes "$DOCKERHUB_UPDATER@$updater_digest"
