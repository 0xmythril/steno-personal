name: Release images
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Validate stable release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const v=require("./package.json").version;if(!/^\d+\.\d+\.\d+$/.test(v)||process.env.RELEASE_TAG!=="v"+v)process.exit(1)'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/smoke.sh
      - run: bash scripts/smoke-upgrades.sh
      - run: node scripts/smoke-upgrade-setup.mjs
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.release.tag_name }}' }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.base }}:${{ github.event.release.tag_name }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.base }}-updater:${{ github.event.release.tag_name }}
          provenance: true
          sbom: true
