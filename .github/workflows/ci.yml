name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    # The release gate: a fresh image on a fresh volume must boot, print a key,
    # and answer on the cookie and the bearer path. It catches what unit tests
    # cannot — a broken Dockerfile, a migration that fails at boot, a supervisor
    # that starts nothing.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/smoke.sh
