name: Feature request
description: Something the project should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read "What this project will not become" in CONTRIBUTING.md first:
        it stays single-user, read-only, and self-hosted.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like it to do instead, if you have a shape in mind.
